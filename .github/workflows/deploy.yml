name: CI / CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------
  # Job 1: Test Backend and Frontend
  # -------------------------------------------------------------
  test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for OCR & Testing
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu libheif-dev

      - name: Install backend dependencies & run tests
        run: |
          python -m pip install --upgrade pip
          pip install ./backend[dev]
          cd backend
          pytest tests/ -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & build
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration production

  # -------------------------------------------------------------
  # Job 2: Build & Push Docker Images to GitHub Container Registry
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      repo_owner: ${{ steps.repo_owner.outputs.lowercase }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: |
          echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Backend Image (Used for both API and Worker)
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./deploy/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.lowercase }}/paperless-backend:latest
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.lowercase }}/paperless-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Build Frontend Image (Nginx + Angular PWA)
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.lowercase }}/paperless-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.lowercase }}/paperless-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # -------------------------------------------------------------
  # Job 3: Deploy to Server via SSH
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Deployment Secrets
        id: check_secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::warning::SERVER_HOST or SERVER_SSH_KEY secret is not configured in repository secrets. Skipping server deployment step. See server.md for setup instructions."
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "$SERVER_SSH_KEY" =~ ^ssh- ]]; then
            echo "::error::SERVER_SSH_KEY contains an SSH PUBLIC key (starts with 'ssh-')! You must provide the PRIVATE key (starts with '-----BEGIN ... PRIVATE KEY-----')."
            exit 1
          elif [[ "$SERVER_SSH_KEY" != *"BEGIN"* ]]; then
            echo "::error::SERVER_SSH_KEY does not appear to be a valid private key (missing 'BEGIN ... PRIVATE KEY' header). Please check your secret."
            exit 1
          else
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy deployment files to server
        if: steps.check_secrets.outputs.skip_deploy != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "compose.yaml,.env.example"
          target: ${{ secrets.SERVER_DEPLOY_PATH || '/opt/paperless' }}

      - name: Deploy containers via SSH
        if: steps.check_secrets.outputs.skip_deploy != 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_IMAGE: ${{ needs.build-and-push.outputs.repo_owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH || '/opt/paperless' }}
          ADMIN_PW: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: REPO_IMAGE,GH_ACTOR,GH_TOKEN,DEPLOY_PATH,ADMIN_PW
          script: |
            set -e
            cd "$DEPLOY_PATH"
            mkdir -p data

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "Creating initial .env from .env.example..."
              cp .env.example .env
              RAND_KEY=$(openssl rand -hex 32 2>/dev/null || date +%s%N)
              sed -i "s|change-this-to-a-random-secret-key-in-production|$RAND_KEY|" .env 2>/dev/null || true
            fi

            # Update ADMIN_PASSWORD in .env if provided in secrets
            if [ -n "$ADMIN_PW" ]; then
              if grep -q "^ADMIN_PASSWORD=" .env; then
                sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$ADMIN_PW|" .env
              else
                echo "ADMIN_PASSWORD=$ADMIN_PW" >> .env
              fi
            fi

            # Export image names from GHCR
            export IMAGE_BACKEND="ghcr.io/$REPO_IMAGE/paperless-backend:latest"
            export IMAGE_FRONTEND="ghcr.io/$REPO_IMAGE/paperless-frontend:latest"

            # Authenticate to GHCR on server
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull latest images and recreate containers
            IMAGE_BACKEND="$IMAGE_BACKEND" IMAGE_FRONTEND="$IMAGE_FRONTEND" docker compose pull
            IMAGE_BACKEND="$IMAGE_BACKEND" IMAGE_FRONTEND="$IMAGE_FRONTEND" docker compose up -d --remove-orphans

            # Health verification
            echo "Waiting for services to become healthy..."
            sleep 8
            docker compose ps
