<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Paperless</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    if (typeof Iterator === 'undefined') {
      var IteratorPrototype = Object.getPrototypeOf(Object.getPrototypeOf([][Symbol.iterator]()));
      globalThis.Iterator = function () {};
      globalThis.Iterator.prototype = IteratorPrototype;
    }
    if (typeof Promise.try !== 'function') {
      Promise.try = function (fn, ...args) {
        return new Promise(function (resolve) {
          resolve(fn(...args));
        });
      };
    }
    if (typeof Promise.withResolvers !== 'function') {
      Promise.withResolvers = function () {
        var res, rej;
        var p = new Promise(function (resolve, reject) {
          res = resolve;
          rej = reject;
        });
        return { promise: p, resolve: res, reject: rej };
      };
    }
    (function () {
      try {
        var theme = localStorage.getItem('paperless_theme');
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        var saved = JSON.parse(localStorage.getItem('paperless_vars') || 'null');
        if (saved) {
          var vars = dark ? saved.dark : saved.light;
          for (var key in vars) {
            if (Object.prototype.hasOwnProperty.call(vars, key)) root.style.setProperty(key, vars[key]);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && vars['--bg']) meta.setAttribute('content', vars['--bg']);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Bitte aktiviere JavaScript, um Paperless zu verwenden.</noscript>
</body>
</html>
