services:
  api:
    image: ${IMAGE_BACKEND:-ghcr.io/bonbonn1912/paperless-backend:latest}
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ${PAPERLESS_DATA_DIR:-./data}:/data
    networks:
      - paperless-net
    depends_on:
      - worker
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: ${IMAGE_BACKEND:-ghcr.io/bonbonn1912/paperless-backend:latest}
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    command: ["python", "-m", "app.processing.worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-3m}
      - OLLAMA_CONTEXT_WINDOW=${OLLAMA_CONTEXT_WINDOW:-8192}
    volumes:
      - ${PAPERLESS_DATA_DIR:-./data}:/data
    networks:
      - paperless-net
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M

  ollama:
    image: ollama/ollama:latest
    container_name: paperless-ollama
    restart: unless-stopped
    volumes:
      - ${PAPERLESS_OLLAMA_DIR:-./data/ollama}:/root/.ollama
    networks:
      - paperless-net
    ports:
      - "${OLLAMA_HOST_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=3m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M

  web:
    image: ${IMAGE_FRONTEND:-ghcr.io/bonbonn1912/paperless-frontend:latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "${PAPERLESS_HOST_BIND:-127.0.0.1}:${PAPERLESS_PORT:-8088}:80"
    restart: unless-stopped
    networks:
      - paperless-net
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  paperless-net:
    driver: bridge
